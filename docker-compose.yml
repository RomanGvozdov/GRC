services:
  db:
    # pgvector/pgvector — це postgres:16 + розширення vector (для AI-RAG, ТЗ §9);
    # повністю сумісний з postgres:16, наявні дані не зачіпає
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: grc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD у .env}
      POSTGRES_DB: grc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grc"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://grc:${POSTGRES_PASSWORD}@db:5432/grc
      SECRET_KEY: ${SECRET_KEY:?Задайте SECRET_KEY у .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Адміністратор}
      UPLOAD_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-grc@localhost}
      BASE_URL: ${BASE_URL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DIGEST_HOUR: ${DIGEST_HOUR:-8}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai_compat}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-}
      AI_EMBED_DIM: ${AI_EMBED_DIM:-1024}
      WAZUH_ENABLED: ${WAZUH_ENABLED:-false}
      WAZUH_API_URL: ${WAZUH_API_URL:-}
      WAZUH_API_USER: ${WAZUH_API_USER:-}
      WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD:-}
      WAZUH_INDEXER_URL: ${WAZUH_INDEXER_URL:-}
      WAZUH_INDEXER_USER: ${WAZUH_INDEXER_USER:-}
      WAZUH_INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-}
      WAZUH_VERIFY_SSL: ${WAZUH_VERIFY_SSL:-true}
      WAZUH_CA_BUNDLE: ${WAZUH_CA_BUNDLE:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Локальний LLM-сервер (OpenAI-сумісний) для AI-функцій (ТЗ §9).
  # Запускається лише з профілем "ai": `docker compose --profile ai up -d`.
  # КСЗІ: модель локальна, дані не покидають периметр.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ollama:/root/.ollama
    # Порт назовні не публікуємо — доступ лише з backend по внутрішній мережі.
    # Для GPU розкоментуйте (потрібен nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  ollama:
